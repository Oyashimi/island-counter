<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>island-counter</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <h1>island-counter</h1>
      <form id="controls" class="controls">
        <label>縦 <input id="height" type="number" min="1" max="2000" value="30" /></label>
        <label>横 <input id="width" type="number" min="1" max="2000" value="40" /></label>
        <label>壁の割合 <input id="wall-ratio" type="number" min="0" max="1" step="0.05" value="0.3" /></label>
        <button type="submit">ランダム生成</button>
      </form>
      <p id="status" class="status"></p>
      <div class="board">
        <canvas id="board"></canvas>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
